# 의존성 안전 기준: 라이선스·위험 등급·복제 허용 목록.
[advisories]
version = 2

[licenses]
version = 2
# OSI·FSF 승인 관례 라이선스만 허용한다. copyleft(LGPL·GPL)와 미승인(CDLA)은 기본 거부.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "MIT-0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 1.0

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
