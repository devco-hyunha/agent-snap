# 의존성 안전 기준: 라이선스·위험 등급·복제 허용 목록.
[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Zlib"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
